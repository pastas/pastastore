name: pastastore

on:
  # Trigger the workflow on push or pull request on master,
  # and only on pull-requests on dev branch
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

concurrency:
  # Group by workflow name and ref (branch or pull request ref).
  # For pushes the ref is the branch (refs/heads/<branch>).
  # For PR events the ref is refs/pull/<number>/merge — same across commits for that PR.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv with Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          python-version: 3.13

      - name: Install the project
        run: uv sync --extra lint

      - name: ruff-lint
        run: uv run ruff check

      - name: ruff-format
        run: uv run ruff format --check

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        pastas-version: [
            # "git+https://github.com/pastas/pastas.git@v1.4.0",
            "git+https://github.com/pastas/pastas.git@v1.5.0",
            "git+https://github.com/pastas/pastas.git@v1.14.0",
            "git+https://github.com/pastas/pastas.git@v2.0.0",
            "git+https://github.com/pastas/pastas.git@dev",
          ]
        experimental: [false]
        exclude:
          - python-version: "3.15"
            pastas-version: "git+https://github.com/pastas/pastas.git@v1.5.0"
          - python-version: "3.15"
            pastas-version: "git+https://github.com/pastas/pastas.git@v1.14.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install the project
        run: |
          uv pip install "${{ matrix.pastas-version }}"
          uv pip install -e .[dev]

      - name: Check numpy and scipy version
        if: ${{ matrix.pastas-version == 'git+https://github.com/pastas/pastas.git@v1.4.0' || matrix.pastas-version == 'git+https://github.com/pastas/pastas.git@v1.5.0' }}
        run: |
          # numpy<2.0/scipy<1.17 have no wheels for Python >= 3.15 and fail to
          # build from source there, so only downgrade on older Pythons
          if python -c "import sys; sys.exit(0 if sys.version_info < (3, 15) else 1)"; then
            uv pip install "numpy<2.0" "scipy<1.17"
          else
            echo "Skipping numpy/scipy downgrade on Python ${{ matrix.python-version }}"
          fi

      - name: Print versions
        run: |
          python -c "import pastastore as pst; pst.show_versions(optional=True)"

      - name: Run pytest
        run: |
          pytest -m "not (bgmap or pastas150)"

      - name: Run all tests once
        if: ${{ matrix.python-version == '3.13' && matrix.pastas-version == 'git+https://github.com/pastas/pastas.git@dev' }}
        run: |
          pytest -m ""

      - name: Run codacy-coverage-reporter
        if: ${{ github.repository == 'pastas/pastastore' && success() }}
        uses: codacy/codacy-coverage-reporter-action@master
        with:
          project-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: coverage.xml
